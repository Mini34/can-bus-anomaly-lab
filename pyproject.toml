[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-bus-anomaly-lab"
version = "0.1.0"
description = "A deterministic CAN traffic simulator and defensive anomaly detector"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mina Soliman" }]

[project.scripts]
can-anomaly-lab = "can_anomaly_lab.cli:main"
