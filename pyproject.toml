[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-bus-anomaly-lab"
version = "0.1.0"
description = "A deterministic CAN traffic simulator and defensive anomaly detector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mina Soliman" }]

[project.optional-dependencies]
dev = ["ruff>=0.16.0,<1.0"]

[project.scripts]
can-anomaly-lab = "can_anomaly_lab.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
